name: Update SideStore source

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Existing standard build number'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sidestore-source
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download the existing IPA and update the source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::Build must be a number"; exit 1; }
          gh release download "build-$BUILD" --repo "$GITHUB_REPOSITORY" --pattern "AyuGram-standard-$BUILD.ipa"
          python3 ci/sidestore_source.py "AyuGram-standard-$BUILD.ipa" "$GITHUB_REPOSITORY" "$BUILD" --publish
